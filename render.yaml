services:
  - type: web
    name: codespace-sms-hub
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: SMS_PROVIDER
        value: mock
