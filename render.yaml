databases:
  - name: codespace-sms-db
    plan: basic-256mb
    databaseName: codespace_sms
    user: codespace_sms

services:
  - type: web
    name: codespace-sms-hub
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: codespace-sms-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: SMS_PROVIDER
        value: mock
